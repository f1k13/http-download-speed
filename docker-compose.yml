services:
  speedtest:
    build: .
    image: speedtest
    # Нормальная доставка сигналов (Ctrl+C, docker stop) и уборка процессов.
    init: true
    # URL можно передать аргументом: docker compose run --rm speedtest <url>
    # или переменной окружения:      URL=<url> docker compose run --rm speedtest
    command: ["${URL:-https://proof.ovh.net/files/10Mb.dat}"]
